<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Ally Sky Project — science fiction across narrative, music, visual art, and interactive design."
    />
    <meta name="theme-color" content="#06080c" />
    <meta name="robots" content="index, follow" />
    <title>Ally Sky Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Code+Pro:ital,wght@0,500;0,800;1,800&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/beacon.css" />
    <link rel="stylesheet" href="css/wordmark.css" />
    <link rel="stylesheet" href="css/site-nav.css" />
    <link rel="stylesheet" href="css/site-footer.css" />
    <link rel="stylesheet" href="css/transmission-stack.css" />
    <link rel="stylesheet" href="css/artifact-stack.css" />
    <link rel="modulepreload" href="js/site-nav.js" />
    <link rel="modulepreload" href="js/wordmark-glitch.js" />
  </head>
  <body>
    <div class="beacon beacon--home">
      <div id="site-nav"></div>
      <aside
        id="transmission-stack"
        class="transmission-stack"
        aria-label="Transmission stack"
        hidden
      ></aside>
      <aside
        id="artifact-stack"
        class="artifact-stack"
        aria-label="Artifact stack"
        hidden
      ></aside>
      <div id="site-footer"></div>
    </div>

    <script type="module">
      import { mountSiteNav } from "./js/site-nav.js";
      import { mountSiteFooter } from "./js/site-footer.js";
      import { mountTransmissionStack } from "./js/transmission-stack.js";
      import { mountArtifactStack } from "./js/artifact-stack.js";

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      mountSiteNav(document.getElementById("site-nav"), "home", { reducedMotion });
      mountSiteFooter(document.getElementById("site-footer"));
      mountTransmissionStack(document.getElementById("transmission-stack"));
      mountArtifactStack(document.getElementById("artifact-stack"));
    </script>
  </body>
</html>
