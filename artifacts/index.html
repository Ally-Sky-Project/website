<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080c" />
    <meta
      name="description"
      content="NTQTP artifact registry — tracks, software, and story-layer objects."
    />
    <title>Artifacts · Ally Sky Engineering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Code+Pro:ital,wght@0,500;0,800;1,800&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/beacon.css" />
    <link rel="stylesheet" href="/css/wordmark.css" />
    <link rel="stylesheet" href="/css/site-nav.css" />
    <link rel="stylesheet" href="/css/site-footer.css" />
    <link rel="stylesheet" href="/css/artifacts.css" />
  </head>
  <body>
    <div class="beacon beacon--home">
      <div id="site-nav"></div>
      <header class="artifacts-header">
        <h1>Artifact registry</h1>
        <p>
          Story-layer objects separate from transmissions. Tracks, tools, and other artifacts linked
          to the canon when relevant — no outbound listen registry on this beacon.
        </p>
      </header>
      <div id="registry" aria-live="polite">
        <p class="artifacts-empty">Loading…</p>
      </div>
      <div id="site-footer"></div>
    </div>
    <script type="module">
      import { mountSiteNav } from "/js/site-nav.js";
      import { mountSiteFooter } from "/js/site-footer.js";
      import { mountArtifactsRegistry } from "/js/artifacts.js";

      mountSiteNav(document.getElementById("site-nav"), "artifacts");
      mountSiteFooter(document.getElementById("site-footer"));
      mountArtifactsRegistry(document.getElementById("registry"));
    </script>
  </body>
</html>
