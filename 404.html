<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comic · Ally Sky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Code+Pro:ital,wght@0,500;0,800;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/comic/reader.css" />
    <link rel="stylesheet" href="/css/wordmark.css" />
    <link rel="stylesheet" href="/css/site-nav.css" />
    <link rel="stylesheet" href="/css/site-footer.css" />
    <script>
      (function () {
        var path = location.pathname.replace(/^\/+|\/+$/g, "");
        if (/^\d+$/.test(path)) {
          fetch("/comic/registry.json")
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (data) {
              if (!data || !data.releases) {
                location.replace("/");
                return;
              }
              var slot = parseInt(path, 10);
              var byStory = {};
              data.releases.forEach(function (r) {
                if (!r.slot || r.slot < 1) return;
                var key = (r.gscript || r.deck || r.id || "").toLowerCase();
                if (!key) return;
                var prev = byStory[key];
                if (!prev || r.slot >= prev.slot) byStory[key] = r;
              });
              var hit = Object.keys(byStory)
                .map(function (k) {
                  return byStory[k];
                })
                .find(function (r) {
                  return r.slot === slot;
                });
              if (hit && hit.id) location.replace("/" + hit.id + "/");
              else location.replace("/");
            })
            .catch(function () {
              location.replace("/");
            });
          return;
        }
        if (!/^[a-f0-9]{16}\d+$/i.test(path)) {
          location.replace("/");
        }
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <div id="site-nav"></div>
      <div id="app">
        <p class="meta">Loading…</p>
      </div>
      <div id="site-footer"></div>
    </div>
    <script type="module">
      import { mountSiteNav } from "/js/site-nav.js";
      import { mountSiteFooter } from "/js/site-footer.js";
      mountSiteNav(document.getElementById("site-nav"), "");
      mountSiteFooter(document.getElementById("site-footer"), { minimal: true });
    </script>
    <script type="module" src="/comic/reader.js"></script>
  </body>
</html>
