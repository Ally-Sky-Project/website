<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080c" />
    <meta
      name="description"
      content="NTQTP transmission registry — subjects, publication IDs, and cross-post links."
    />
    <title>Transmissions · Ally Sky Engineering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Code+Pro:ital,wght@0,500;0,800;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/beacon.css" />
    <link rel="stylesheet" href="/css/wordmark.css" />
    <link rel="stylesheet" href="/css/site-nav.css" />
    <link rel="stylesheet" href="/css/site-footer.css" />
    <link rel="stylesheet" href="/css/transmissions.css" />
  </head>
  <body>
    <div class="beacon">
      <div id="site-nav"></div>
      <header class="transmissions-header">
        <h1>Transmission registry</h1>
        <p>
          NTQTP transmissions. Each row is the latest ID for a transmission; open the ID to read the
          transmission.
        </p>
      </header>
      <div id="registry" aria-live="polite">
        <p class="transmissions-empty">Loading…</p>
      </div>
      <div id="site-footer"></div>
    </div>
    <script type="module">
      import { mountSiteNav } from "/js/site-nav.js";
      import { mountSiteFooter } from "/js/site-footer.js";
      import { mountTransmissionsRegistry } from "/js/transmissions.js";

      mountSiteNav(document.getElementById("site-nav"), "transmissions");
      mountSiteFooter(document.getElementById("site-footer"));
      mountTransmissionsRegistry(document.getElementById("registry"));
    </script>
  </body>
</html>
